# /etc/nginx/sites-available/tv.anixapp.com
# Static TV SPA from /opt/anixapp-tv  (Y:\anixapp-tv)

server {
    listen 80;
    listen [::]:80;
    server_name tv.anixapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tv.anixapp.com;

    ssl_certificate /etc/letsencrypt/live/tv.anixapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.anixapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/anixapp-tv;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Kodik resolve + CDN/HLS proxy (node scripts/tv-bridge-server.mjs on :8790)
    location /__anix/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2|png|svg|jpe?g|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
